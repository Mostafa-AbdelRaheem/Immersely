services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: immersely
      POSTGRES_PASSWORD: immersely12345
      POSTGRES_DB: immersely_db
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://immersely:immersely12345@postgres:5432/immersely_db
    depends_on:
      - postgres

volumes:
  pgdata: